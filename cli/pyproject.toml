[project]
name = "viva-la-trace"
version = "0.1.0"
description = "Take your agent traces back."
requires-python = ">=3.10"
dependencies = ["rich>=13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vlt = "vlt.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlt"]
